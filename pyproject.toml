[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyguibud"
dynamic = ["version"]
description = "Drag-and-drop GUI designer for ttkbootstrap (and optionally PySide6) that saves portable .ui files."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Luciano Arrezze" }]
keywords = ["gui", "designer", "ttkbootstrap", "tkinter", "pyside6", "drag-and-drop", "ui"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "ttkbootstrap>=2.2,<3",
]

[project.optional-dependencies]
pyside = ["PySide6>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "babel>=2.14",
]

[project.scripts]
pyguibud = "pyguibud.cli:main"
pyguibud-uic = "pyguibud.uic:main"

[project.entry-points."pyguibud.widgets"]
core = "pyguibud.core.widgets:core_widgets"
tb = "pyguibud.core.widgets:tb_widgets"

[project.entry-points."pyguibud.backends"]
ttkbootstrap = "pyguibud.backends.ttkbootstrap:TtkbootstrapBackend"
tkinter = "pyguibud.backends.tkinter:TkinterBackend"
pyside6 = "pyguibud.backends.pyside6:PySide6Backend"

[dependency-groups]
dev = [
    "pyguibud[dev]",
    # Dev-only SVG rasteriser of tools/gen_icons.py (MIT binding of resvg; static, no system DLL).
    "resvg-py>=0.5,<0.6",
]

# ---------------------------------------------------------------- build
[tool.hatch.version]
path = "src/pyguibud/__about__.py"

[tool.hatch.build.targets.wheel]
# Step 04: both packages ship in the pyguibud wheel; a standalone
# pyguibud-runtime distribution is planned for a later step.
packages = ["src/pyguibud", "src/pyguibud_runtime"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/LICENSE",
    "/NOTICE.md",
    "/pyproject.toml",
]
exclude = [
    "/.claude",
    "/.github",
    "/assets/brand",
]

# ---------------------------------------------------------------- tools
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
# Generated by pyguibud-uic (long lines by design); tests keep it equal to a fresh generation.
extend-exclude = ["examples/hello_ui.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyguibud_runtime", "pyguibud_runtime.*", "pyguibud.core.*", "pyguibud.cli", "pyguibud.uic"]
strict = true

[[tool.mypy.overrides]]
# The Tk views call ttkbootstrap, which ships no type information.
module = ["pyguibud.designer.app", "pyguibud.designer.theme_tk"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["babel", "babel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PySide6 is an optional extra (spec backends D19): strict mypy passes with and without it.
module = ["PySide6", "PySide6.*", "shiboken6", "shiboken6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Without the PySide6 stubs, QObject is Any.
module = [
    "pyguibud.backends._qt",
    "pyguibud.preview._host_qt",
    "pyguibud.preview._describe_qt",
    "tests.qt.*",
]
disallow_subclassing_any = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --capture=sys: fd-level capture dup2()s fds 1/2 around every test, closing the OS handles Tcl
# wrapped as its stdout/stderr channels when the session Tk root was created. Tcl on Windows
# looks channels up by raw HANDLE value, so a file Tk opens later that reuses one of those values
# fails with an empty TclError (QA-10-13, Tcl 8.6 win/tclWinChan.c OpenFileChannel).
addopts = "-ra --strict-markers --strict-config --capture=sys"
markers = [
    "gui: needs a Tk display",
    "qt: needs PySide6 (run offscreen)",
    "slow: slow tests (clean virtual environments)",
]

[tool.coverage.run]
source = ["pyguibud", "pyguibud_runtime"]
branch = true

[tool.coverage.report]
show_missing = true
