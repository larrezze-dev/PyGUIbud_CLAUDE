[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyguibud"
dynamic = ["version"]
description = "Drag-and-drop GUI designer for ttkbootstrap (and optionally PySide6) that saves portable .ui files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Luciano Arrezze" }]
keywords = ["gui", "designer", "ttkbootstrap", "tkinter", "pyside6", "drag-and-drop", "ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Natural Language :: Dutch",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Italian",
    "Natural Language :: Portuguese",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    # Exact pin: one version for both distributions (spec packaging D6; tools/bump_version.py).
    "pyguibud-runtime==0.1.0rc1",
    # The designer imports ttkbootstrap directly, not only through the runtime.
    "ttkbootstrap>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/larrezze-dev/PyGUIbud_CLAUDE"
Source = "https://github.com/larrezze-dev/PyGUIbud_CLAUDE"
Issues = "https://github.com/larrezze-dev/PyGUIbud_CLAUDE/issues"
Changelog = "https://github.com/larrezze-dev/PyGUIbud_CLAUDE/releases"

[project.optional-dependencies]
pyside = ["pyguibud-runtime[pyside]==0.1.0rc1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "babel>=2.14",
]

[project.scripts]
pyguibud = "pyguibud.cli:main"
pyguibud-uic = "pyguibud.uic:main"

# The pyguibud.widgets / pyguibud.backends entry points are declared by pyguibud-runtime only
# (ADR-016, spec packaging D4).

[dependency-groups]
dev = [
    "pyguibud[dev]",
    # Dev-only SVG rasteriser of tools/gen_icons.py (MIT binding of resvg; static, no system DLL).
    "pytest-randomly>=5.0.0",
    "resvg-py>=0.5,<0.6",
]

# ---------------------------------------------------------------- build
[tool.hatch.version]
# The single version literal lives in the runtime (spec packaging D6).
path = "runtime/src/pyguibud/__about__.py"

[tool.hatch.build.targets.wheel]
# The designer portion of the `pyguibud` namespace package; the runtime portion (core, backends,
# i18n, locale, pyguibud_runtime) ships in pyguibud-runtime (ADR-016).
packages = ["src/pyguibud"]
exclude = ["*.po", "*.pot"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/runtime/src/pyguibud/__about__.py",
    "/tests",
    "/docs",
    "/examples",
    # The tests read the catalogues from the runtime source tree (tests/_paths.py).
    "/runtime/src/pyguibud/locale",
    "/README.md",
    "/LICENSE",
    "/NOTICE.md",
    "/pyproject.toml",
]
exclude = [
    "/.claude",
    "/.github",
    "/assets/brand",
]

[tool.uv.workspace]
members = ["runtime"]

[tool.uv.sources]
pyguibud-runtime = { workspace = true }

# ---------------------------------------------------------------- tools
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "runtime/src", "tests"]
# Generated by pyguibud-uic (long lines by design); tests keep it equal to a fresh generation.
extend-exclude = ["examples/hello_ui.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
# ADR-016: `pyguibud` is a PEP 420 namespace split over two source roots.
mypy_path = ["src", "runtime/src"]
explicit_package_bases = true
files = ["src", "runtime/src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyguibud_runtime", "pyguibud_runtime.*", "pyguibud.core.*", "pyguibud.cli", "pyguibud.uic"]
strict = true

[[tool.mypy.overrides]]
# The Tk views call ttkbootstrap, which ships no type information.
module = ["pyguibud.designer.app", "pyguibud.designer.theme_tk"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["babel", "babel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PySide6 is an optional extra (spec backends D19): strict mypy passes with and without it.
module = ["PySide6", "PySide6.*", "shiboken6", "shiboken6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Without the PySide6 stubs, QObject is Any.
module = [
    "pyguibud.backends._qt",
    "pyguibud.preview._host_qt",
    "pyguibud.preview._describe_qt",
    "tests.qt.*",
]
disallow_subclassing_any = false

[tool.pyright]
# Editors (Pylance): the pyguibud namespace spans both source roots (ADR-016).
extraPaths = ["src", "runtime/src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --capture=sys: fd-level capture dup2()s fds 1/2 around every test, closing the OS handles Tcl
# wrapped as its stdout/stderr channels when the session Tk root was created. Tcl on Windows
# looks channels up by raw HANDLE value, so a file Tk opens later that reuses one of those values
# fails with an empty TclError (QA-10-13, Tcl 8.6 win/tclWinChan.c OpenFileChannel).
# -p no:randomly keeps the default order deterministic; `-p randomly --randomly-seed=N` shuffles.
addopts = "-ra --strict-markers --strict-config --capture=sys -p no:randomly"
markers = [
    "gui: needs a Tk display",
    "qt: needs PySide6 (run offscreen)",
    "slow: slow tests (clean virtual environments)",
    "budget: a timing budget (skipped under coverage tracing)",
]

[tool.coverage.run]
# Directories, so both namespace portions are found (ADR-016).
source = ["src", "runtime/src"]
branch = true

[tool.coverage.report]
show_missing = true
