name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv's own CPython builds ship tkinter; a runner's system Python may not (Step 20b.1).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  # Blocking on every platform: lint, types and every test that needs no Tk root (Step 20b.1).
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Install xvfb (some tests start a Tk process)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests without the session Tk root (under xvfb on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" uv run python -m pytest --cov -m "not qt and not gui and not install"
      - name: Tests without the session Tk root
        if: runner.os != 'Linux'
        run: uv run python -m pytest --cov -m "not qt and not gui and not install"

  # The Tk GUI tests. Blocking on Windows (the development platform); Linux (Xvfb) and macOS
  # runners still differ in focus, clipboard and window management, so they report without
  # blocking until the "CI GUI parity" backlog item is done (Step 20b.1).
  gui:
    name: gui (${{ matrix.os }}, py${{ matrix.python-version }})${{ !matrix.blocking && ' [non-blocking]' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        blocking: [true]
        include:
          - { os: ubuntu-latest, python-version: "3.12", blocking: false }
          # uv's CPython 3.10 for Linux/macOS ships Tk 9 with Python 3.10's tkinter (Step 20b.1).
          - { os: ubuntu-latest, python-version: "3.10", blocking: false }
          - { os: macos-latest, python-version: "3.12", blocking: false }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: GUI tests (under xvfb on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" uv run python -m pytest -m "gui and not qt"
      - name: GUI tests
        if: runner.os != 'Linux'
        run: uv run python -m pytest -m "gui and not qt"

  # PySide6 backend (spec backends.md D19): its own job and process, so Tk and
  # Qt never share one process (macOS). mypy here checks against the real stubs.
  # macOS maps Ctrl and Cmd differently in Qt; non-blocking until the parity backlog item.
  qt:
    name: qt (${{ matrix.os }}, py3.12)${{ matrix.os == 'macos-latest' && ' [non-blocking]' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra pyside
      - run: uv run mypy
      - name: Install the Qt runtime libraries and xvfb (some qt tests also build a Tk window)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb
      - name: Qt tests (under xvfb on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run python -m pytest -m qt
      - name: Qt tests
        if: runner.os != 'Linux'
        run: uv run python -m pytest -m qt

  # Both distributions, built through their sdists (spec packaging §5.1, R6).
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv build --all-packages
      - run: uvx twine check --strict dist/*
      - run: python3 tools/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install the built artefacts into clean environments, outside the checkout (spec packaging §6,
  # tools/verify_install.py).
  install-smoke:
    name: install-smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libtk8.6
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      # Version, pip designer venv (spec section 6 checks 1-7 and pip check), pip runtime-only
      # venv, then uv tool install and uvx. One temporary folder outside the checkout.
      - name: Install the built distributions and smoke-test them
        run: python tools/verify_install.py --dist dist
