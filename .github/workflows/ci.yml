name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv's own CPython builds ship tkinter; a runner's system Python may not (Step 20b.1).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  # Blocking on every platform: lint, types and every test that needs no Tk root (Step 20b.1).
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Install xvfb (some tests start a Tk process)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests without the session Tk root (under xvfb on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" uv run python -m pytest --cov -m "not qt and not gui"
      - name: Tests without the session Tk root
        if: runner.os != 'Linux'
        run: uv run python -m pytest --cov -m "not qt and not gui"

  # The Tk GUI tests. Blocking on Windows (the development platform); Linux (Xvfb) and macOS
  # runners still differ in focus, clipboard and window management, so they report without
  # blocking until the "CI GUI parity" backlog item is done (Step 20b.1).
  gui:
    name: gui (${{ matrix.os }}, py${{ matrix.python-version }})${{ matrix.blocking && '' || ' [non-blocking]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        blocking: [true]
        include:
          - { os: ubuntu-latest, python-version: "3.12", blocking: false }
          - { os: macos-latest, python-version: "3.12", blocking: false }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: GUI tests (under xvfb on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" uv run python -m pytest -m "gui and not qt"
      - name: GUI tests
        if: runner.os != 'Linux'
        run: uv run python -m pytest -m "gui and not qt"

  # PySide6 backend (spec backends.md D19): its own job and process, so Tk and
  # Qt never share one process (macOS). mypy here checks against the real stubs.
  # macOS maps Ctrl and Cmd differently in Qt; non-blocking until the parity backlog item.
  qt:
    name: qt (${{ matrix.os }}, py3.12)${{ matrix.os == 'macos-latest' && ' [non-blocking]' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra pyside
      - run: uv run mypy
      - name: Install the Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv run python -m pytest -m qt

  # Both distributions, built through their sdists (spec packaging §5.1, R6).
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv build --all-packages
      - run: uvx twine check --strict dist/*
      - run: python3 tools/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install the built artefacts into clean environments, outside the checkout (spec packaging §6).
  install-smoke:
    name: install-smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libtk8.6
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Version, paths and a work folder outside the checkout
        run: |
          ver=$(tr -d '\r' < runtime/src/pyguibud/__about__.py | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          test -n "$ver"
          bin=bin; if [ "$RUNNER_OS" = Windows ]; then bin=Scripts; fi
          work="$RUNNER_TEMP/work"; mkdir -p "$work"; cp examples/hello.ui "$work/"
          { echo "VER=$ver"; echo "BIN=$bin"; echo "WORK=$work"; echo "DIST=$(cd dist && { pwd -W 2>/dev/null || pwd; })"; } >> "$GITHUB_ENV"
      - name: pip, designer venv
        run: |
          python -m venv "$RUNNER_TEMP/v"
          py="$RUNNER_TEMP/v/$BIN/python"
          "$py" -m pip install --find-links "$DIST" "pyguibud==$VER"
          "$py" -m pip check
          cd "$WORK"
          "$RUNNER_TEMP/v/$BIN/pyguibud" --version | tee version.txt
          grep -q "pyguibud $VER" version.txt
          grep -q "Luciano Arrezze" version.txt
          "$RUNNER_TEMP/v/$BIN/pyguibud-uic" --check hello.ui
          "$RUNNER_TEMP/v/$BIN/pyguibud-uic" hello.ui
          "$py" -I - <<'EOF'
          import pathlib, sys, sysconfig
          sys.path.insert(0, ".")
          import hello_ui  # generated code depends on ttkbootstrap only (ADR-003)
          assert not [k for k in sys.modules if k.startswith("pyguibud")], "generated code imports pyguibud"
          import pyguibud.core, pyguibud.designer
          site = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          for module in (pyguibud.core, pyguibud.designer):
              assert site in pathlib.Path(module.__file__).resolve().parents, module.__file__
          from pyguibud_runtime import load_ui
          class Handlers:  # the two handlers hello.ui binds
              def on_greet(self):
                  pass
              def on_quit(self):
                  pass
          load_ui("hello.ui", Handlers()).destroy()
          print("designer venv OK")
          EOF
      - name: pip, runtime-only venv
        run: |
          python -m venv "$RUNNER_TEMP/r"
          py="$RUNNER_TEMP/r/$BIN/python"
          "$py" -m pip install --find-links "$DIST" "pyguibud-runtime==$VER"
          cd "$WORK"
          "$py" -I - <<'EOF'
          import importlib.metadata as metadata, importlib.util, pathlib, sys, sysconfig
          import pyguibud_runtime
          assert not {"tkinter", "ttkbootstrap"} & set(sys.modules), "import pyguibud_runtime loads a toolkit"
          assert importlib.util.find_spec("pyguibud.designer") is None
          try:
              metadata.distribution("pyguibud")
          except metadata.PackageNotFoundError:
              pass
          else:
              raise AssertionError("pyguibud is installed")
          assert not list(pathlib.Path(sysconfig.get_path("scripts")).glob("pyguibud*"))
          class Handlers:  # the two handlers hello.ui binds
              def on_greet(self):
                  pass
              def on_quit(self):
                  pass
          pyguibud_runtime.load_ui("hello.ui", Handlers()).destroy()
          print("runtime-only venv OK")
          EOF
      - name: uv tool install and uvx
        run: |
          uv tool install --python "${{ matrix.python-version }}" --find-links "$DIST" "pyguibud==$VER"
          "$(uv tool dir --bin)/pyguibud" --version
          cd "$WORK"
          uvx --python "${{ matrix.python-version }}" --find-links "$DIST" --from "pyguibud==$VER" pyguibud-uic --check hello.ui
